<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHorizon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11161d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: #f8fafc;
      user-select: none;
    }
    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .hud-group {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 16px;
    }
    .hud-top-left     { top: 0; left: 0; align-items: flex-start; }
    .hud-top-center   { top: 0; left: 50%; transform: translateX(-50%); align-items: center; }
    .hud-top-right    { top: 0; right: 0; align-items: flex-end; }
    .hud-center       { top: 50%; left: 50%; transform: translate(-50%, -50%); align-items: center; }
    .hud-bottom-center{ bottom: 0; left: 50%; transform: translateX(-50%); align-items: center; }
    .hud-pill {
      background: rgba(15, 23, 42, 0.68);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: pre-line;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .hud-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
    }
    .hud-crosshair::before,
    .hud-crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
    }
    .hud-crosshair::before {
      left: 10px; top: 0; width: 2px; height: 22px;
    }
    .hud-crosshair::after {
      top: 10px; left: 0; width: 22px; height: 2px;
    }
    .hud-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 28px 42px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .hud-banner h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }
    .hud-banner p {
      font-size: 16px;
      color: #cbd5e1;
      white-space: pre-line;
    }
    #status-badge {
      position: fixed;
      left: 12px;
      bottom: 10px;
      z-index: 20;
      pointer-events: none;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: rgba(226, 232, 240, 0.72);
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="hud"></div>
  <div id="status-badge">Connecting to Haskell...</div>
  <script type="module" src="/bundle.js"></script>
</body>
</html>
